[project]
name = "c1-aml-fp-reducer"
version = "0.1.0"
description = "C1 AML False-Positive Reducer — LLM-driven alert triage that cuts FP volume 40-70% while preserving 99%+ TP recall"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Yash Patel", email = "yashpatel06050@gmail.com"}]
license = {text = "MIT"}
dependencies = [
    "pandas>=2.2",
    "ollama>=0.4",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "click>=8.1",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
c1-aml-bench = "c1_aml_fp_reducer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
